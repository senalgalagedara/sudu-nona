<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Sudu Nona</title>
  <link rel="icon" type="image/jpeg" href="logo.jfif">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="side-dock" aria-hidden="true"></div>
  <aside id="side">
    <div class="side-brand" title="Sudu Nona - AI Collection">
      <img src="logo.jfif" alt="Sudu Nona" class="brand-logo">
      <div class="brand-info">
        <span class="brand-name">Sudu Nona</span>
      </div>
    </div>
    <div class="side-sep"></div>
    <div id="profiles"></div>
    <div class="side-footer">
      <button id="addP" class="add-btn" title="Add profile" aria-label="Add new profile">
        <span class="add-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
        <span class="add-lbl">Add Profile</span>
      </button>
    </div>
  </aside>

  <main>
    <nav id="top">
      <div id="tabs"></div>
      <div class="sp"></div>
      <div id="mode"><button data-m="single">One at a time</button><button data-m="split">Side by side</button></div>
    </nav>
    <div id="stage"></div>
  </main>
  <script src="renderer.js"></script>
</body>

</html>
